<!DOCTYPE html>
<html>
<head>
  <title>Chat Test Client</title>
  <style>
    body { font-family: sans-serif; max-width: 500px; margin: 40px auto; }
    #messages { border: 1px solid #ccc; height: 200px; overflow-y: auto; padding: 8px; margin-bottom: 8px; }
    #messages div { margin-bottom: 4px; }
    input, button { padding: 6px; }
    #status { color: #666; font-size: 0.9em; margin-bottom: 8px; }
  </style>
</head>
<body>
  <h2>Chat Test Client</h2>
  <div>
    <label>Token: <input id="token" size="50" placeholder="paste your JWT here" /></label>
    <button onclick="connect()">Connect</button>
  </div>
  <div id="status">Not connected</div>
  <div id="messages"></div>
  <input id="msgInput" placeholder="Type a message..." size="40" />
  <button onclick="sendMessage()">Send</button>

  <script>
    let ws = null;

    function connect() {
      const token = document.getElementById('token').value;
      if (!token) { alert('Paste a token first'); return; }

      ws = new WebSocket(`ws://localhost:8080/ws/chat?token=${token}`);

      ws.onopen = () => {
        document.getElementById('status').innerText = 'Connected';
      };

      ws.onmessage = (event) => {
        const div = document.createElement('div');
        try {
          const data = JSON.parse(event.data);
          div.textContent = `User ${data.user_id}: ${data.content}`;
        } catch {
          div.textContent = event.data;
        }
        document.getElementById('messages').appendChild(div);
      };

      ws.onclose = () => {
        document.getElementById('status').innerText = 'Disconnected';
      };

      ws.onerror = (err) => {
        document.getElementById('status').innerText = 'Error (see console)';
        console.error(err);
      };
    }

    function sendMessage() {
      const input = document.getElementById('msgInput');
      if (ws && ws.readyState === WebSocket.OPEN && input.value) {
        ws.send(input.value);
        input.value = '';
      }
    }

    document.getElementById('msgInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') sendMessage();
    });
  </script>
</body>
</html>
